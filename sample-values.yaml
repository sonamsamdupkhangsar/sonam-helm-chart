# Default values for mychart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

args:
  - value: --provider=github
  - value: --email-domain=*

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 9292

istio:
  enabled: false

# In my-app-httproute/values.yaml

appName: "my-service"
appPort: 8080

httproute:
  gatewayName: "shared-tls-gateway" # Name of the pre-existing Gateway
  namespace: "main"      # Namespace of the pre-existing Gateway
  hostnames:
    - "bookinfo.openissuer.com"
  httpsListenerName: "https-bookinfo"   # Listener section name on the Gateway
  httpListenerName: "http-bookinfo"   # Listener section name on the Gateway
  pathPrefix: "/details"

ingress:
  enabled: false
  ingressClass: nginx
  hosts:
    - host: subdomain.domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: domain.com
      hosts:
        - "*.domain.com"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
#   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Optional non-secret application configuration. Each map entry becomes a file in a
# ConfigMap mounted read-only at configMountPath.
configMountPath: /config
configFiles: {}
#  application-policy.yaml: |
#    example:
#      enabled: true

postgres:
  port: "5432"
  postgresUsername: PACT_BROKER_DATABASE_USERNAME
  postgresPassword: PACT_BROKER_DATABASE_PASSWORD
  postgresDbname: PACT_BROKER_DATABASE_NAME

envs:
  - name: DBNAME
    value: mydatabase
  - name: EUREKA_USER
    value: $(eureka_username)
  - name: EUREKA_PASSWORD
    value: $(eureka_password)

# Environment-specific additions that do not replace the base envs list.
extraEnvs: []

# Environment-specific values keyed by variable name. An override replaces a
# matching entry in envs or extraEnvs and is rendered in stable name order.
envOverrides: {}
#  EUREKA_USER: environment-specific-user

postgres:
  secretfile: myscretfile

# this section shows how you can create environment variables using a secret file
# on the k8 cluster    
secretFiles:
  - file: file1
    keys:
      - key: pgdb_username
        name: PG_USERNAME
      - key: pgdb_password
        name: PG_PASSWORD
  - file: file2abc
    keys:
      - key: pgdb_username
        name: PGDB
      - key: apple
        name: APPLE_DB

