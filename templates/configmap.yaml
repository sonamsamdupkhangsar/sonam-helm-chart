{{- with .Values.configFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mychart.fullname" $ }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mychart.labels" $ | nindent 4 }}
data:
  {{- range $name, $content := . }}
  {{ $name | quote }}: |
    {{- tpl ($content | toString) $ | nindent 4 }}
  {{- end }}
{{- end }}
